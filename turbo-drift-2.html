<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbo Drift</title>
<style>
:root{color-scheme:dark;--bg:#0d0f1c;--fg:#f4f6ff;--mut:#a4abcf;--card:#22264a;--acc:#ffc93c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:800;text-shadow:0 2px 6px #000a}
#hud .big{font-size:26px;line-height:1}
#hud small{display:block;font-size:12px;color:#fff9;font-weight:600}
#nbar{position:fixed;left:14px;right:96px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);height:10px;background:#0008;border-radius:6px;overflow:hidden;pointer-events:none}
#nfill{height:100%;width:50%;background:linear-gradient(90deg,#ff8a00,#ffe14a)}
#nit{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:70px;height:70px;border-radius:50%;border:0;background:#ff7a00;color:#fff;font-weight:900;font-size:13px;box-shadow:0 4px 14px #0008}
#nit:active{background:#ffb000}
#toast{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:var(--acc);text-shadow:0 3px 10px #000;opacity:0;transition:opacity .3s;pointer-events:none}
#panel{position:fixed;inset:0;background:rgba(8,9,20,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;overflow:auto}
#panel.hide{display:none}
h1{margin:0;font-size:38px;font-style:italic;letter-spacing:1px}
h2{margin:0}
p{margin:0;color:var(--mut)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 20px;min-width:250px;max-width:100%;background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--acc);color:#1b1400;font-size:19px}
button:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(100%,340px);background:var(--card);border-radius:14px;padding:10px 14px;text-align:left}
.row button{min-width:0;padding:9px 14px;background:var(--acc);color:#1b1400}
.pips{letter-spacing:2px;color:var(--acc)}
.sw{display:inline-block;width:22px;height:22px;border-radius:6px;vertical-align:middle;margin-right:8px}
#panel{background:radial-gradient(circle at 50% 0%,#2c3190 0%,#0b0d20 72%);justify-content:safe center;gap:12px}
#panel canvas{position:static;inset:auto;width:min(100%,320px);height:auto;aspect-ratio:300/140;border-radius:20px;border:1px solid #ffffff26;box-shadow:0 10px 28px #000a}
h1{background:linear-gradient(180deg,#fff,#ffc93c 65%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:42px;font-weight:900;line-height:1.05;filter:drop-shadow(0 3px 0 #0007)}
h2{font-size:26px}
button{border-radius:16px;background:#2d3270;box-shadow:0 4px 0 #171a3d;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #171a3d}
button.main{background:linear-gradient(180deg,#ffd75e,#ffb300);color:#2a1c00;box-shadow:0 4px 0 #b57a00}
.row{background:linear-gradient(180deg,#2c3166,#1f2352);border:1px solid #ffffff1c;border-radius:16px;box-shadow:0 4px 12px #0006}
.row button{min-width:84px;border-radius:12px;background:linear-gradient(180deg,#ffd75e,#ffb300);color:#2a1c00;box-shadow:0 3px 0 #b57a00}
.row button:disabled{background:#4a4f7a;color:#aab3d8;box-shadow:none}
.bar{height:8px;width:150px;max-width:100%;background:#0b0e2a;border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a00,#ffe14a);border-radius:6px}
.sw{width:34px;height:20px;border-radius:6px 6px 10px 10px;border:2px solid #fff7;margin-right:10px}
#hud>div{background:#0b0e22b8;border:1px solid #ffffff24;border-radius:16px;padding:8px 14px;backdrop-filter:blur(6px);min-width:78px}
#nit{background:radial-gradient(circle at 35% 30%,#ffd23c,#ff6a00 70%);border:3px solid #fff9;box-shadow:0 6px 16px #000a,0 0 18px #ff8a0088}
#nbar{height:12px;border:1px solid #fff5;background:#0b0e22b8}
#toast{z-index:20}
#panel.menu{background:linear-gradient(180deg,rgba(10,12,40,.6) 0%,rgba(10,12,40,.1) 38%,rgba(8,9,24,.92) 100%);justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#panel.menu h1{font-size:50px;text-align:center;font-style:italic}
#panel canvas.sh{aspect-ratio:320/190;background:none;border:0;box-shadow:none;border-radius:0}
.top{display:flex;justify-content:space-between;width:100%;max-width:420px}
.pill{display:flex;align-items:center;gap:8px;background:#0b0e2acc;border:1px solid #ffffff2e;border-radius:999px;padding:6px 8px 6px 14px;font-weight:800;box-shadow:0 3px 10px #0008}
.pill b{font-size:17px}
.plus{min-width:0!important;width:30px;height:30px;padding:0!important;border-radius:50%!important;background:linear-gradient(180deg,#7dff9a,#1fbf55)!important;color:#05340f!important;font-size:20px;box-shadow:0 3px 0 #0f7a33!important}
.sub{letter-spacing:9px;font-size:12px;color:#ffd75e;font-weight:800;text-align:center;margin-top:2px}
.stats{display:flex;gap:10px;width:100%;max-width:420px}
.stat{flex:1;background:#0b0e2aa0;border:1px solid #ffffff22;border-radius:14px;padding:8px;font-size:12px;color:var(--mut)}
.stat b{display:block;color:#fff;font-size:19px}
.play{width:100%;max-width:420px;font-size:26px!important;padding:16px!important;letter-spacing:3px;animation:pul 1.4s infinite}
@keyframes pul{50%{transform:scale(1.035)}}
.tiles{display:flex;gap:12px;width:100%;max-width:420px}
.tile{position:relative;min-width:0!important;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 9px!important;border-radius:20px!important;background:linear-gradient(180deg,#3d46a0,#222866)!important;border:1px solid #ffffff33;box-shadow:0 6px 0 #11143a,0 10px 18px #0009!important;font-size:13px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #11143a,0 4px 8px #0009!important}
.ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:32px;border-radius:17px;background:linear-gradient(145deg,#ffe27a,#ff9d00 55%,#c25e00);box-shadow:inset 0 3px 0 #fffa,inset 0 -5px 0 #0004,0 4px 6px #0008}
.ic svg{width:42px;height:42px;filter:drop-shadow(0 2px 1px #0007)}
.dot{position:absolute;top:-6px;right:-4px;background:#ff3b4e;color:#fff;border-radius:999px;font-style:normal;font-size:10px;font-weight:800;padding:3px 7px;box-shadow:0 2px 6px #000a}
#panel.gr{justify-content:flex-start;gap:10px}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
.gh h2{font-size:24px;letter-spacing:4px;font-style:italic}
.bk{min-width:0!important;width:44px;height:44px;padding:0!important;border-radius:14px!important;font-size:28px;line-height:1}
.pw{background:#0b0e2aa8;border:1px solid #ffffff22;border-radius:999px;padding:6px 18px;font-size:12px;letter-spacing:2px;color:var(--mut)}
.pw b{color:#ffd75e;font-size:18px;margin-left:6px}
.paints{display:flex;gap:10px;justify-content:center}
.chip{min-width:0!important;width:52px;height:52px;padding:0!important;border-radius:50%!important;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 45%,#000a 135%)!important;border:3px solid #ffffff44;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 0 #0008!important}
.chip small{font-size:10px;text-shadow:0 1px 2px #000}
.chip.on{border-color:#ffd75e;box-shadow:0 0 0 3px #ffd75e55,0 4px 0 #0008!important}
.ups{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.uc{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#2f3578,#222866);border:1px solid #ffffff2a;border-radius:18px;padding:10px 12px;text-align:left;box-shadow:0 5px 0 #11143a,0 8px 14px #0007}
.uc .ic{flex:none;width:50px;height:50px;font-size:28px}
.ui{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ui em{font-style:normal;color:var(--mut);font-size:12px;margin-left:6px}
.ui small{color:var(--mut)}
.ui u{text-decoration:none;color:#7dff9a;font-weight:700}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:9px;border-radius:5px;background:#0b0e2a}
.segs i.f{background:linear-gradient(90deg,#ff8a00,#ffe14a);box-shadow:0 0 6px #ffb30088}
.buy{min-width:84px!important;padding:11px 10px!important;border-radius:13px!important;background:linear-gradient(180deg,#ffd75e,#ffb300)!important;color:#2a1c00!important;box-shadow:0 3px 0 #b57a00!important}
.buy:disabled{background:#4a4f7a!important;color:#aab3d8!important;box-shadow:none!important}
.max{background:#1fbf55;color:#05340f;font-weight:900;border-radius:12px;padding:10px 12px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div class="big" id="hh"></div><small id="cc"></small></div><div style="text-align:center"><div class="big" id="dd">0</div><small>meters · stage <span id="ss">1</span></small></div><div style="text-align:right"><div class="big" id="sp">0</div><small>km/h</small></div></div>
<div id="nbar"><div id="nfill"></div></div>
<button id="nit">NITRO</button>
<div id="toast"></div>
<div id="panel"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c');let g=cv.getContext('2d'),W,H;
function fit(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}
fit();addEventListener('resize',fit);
const SEG=200,RW=1300,DRAW=90,CAMH=1000,DEPTH=.84,L=1000,PZ=900;
const COLS=['#e63946','#3a86ff','#ffbe0b','#06d6a0','#b5179e'],CCOST=[0,80,80,150,150];
const UPN={eng:'Engine (top speed)',nit:'Nitro (capacity)',han:'Handling (steering)'},UC=[60,140,260,450,750];
let S={coins:0,best:0,eng:0,nit:0,han:0,col:0,own:[0]};
try{Object.assign(S,JSON.parse(localStorage.getItem('td')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('td',JSON.stringify(S))}catch(e){}};
const curve=new Float32Array(L);
(function(){let i=0;while(i<L){const len=50+Math.random()*60|0,t=[-3,-2,0,0,2,3][Math.random()*6|0];for(let k=0;k<len&&i<L;k++,i++)curve[i]=t*Math.min(k,len-k,20)/20}for(let i=L-20;i<L;i++)curve[i]*=(L-i)/20})();
let run=false,pos,speed,px,nitro,nOn,hearts,dist,rc,inv,items,spT,stage,revived,doubled,lastEarn,shake,bg=0,steerS=0,last=0;
let touch=0,keyL=0,keyR=0,tgt=null,ds=0,dp=0;
function maxS(){return 11000+S.eng*1400}
function start(){pvTok++;pos=0;speed=0;px=0;nitro=.5;nOn=false;hearts=3;dist=0;rc=0;inv=0;items=[];spT=1;stage=1;revived=false;doubled=false;shake=0;run=true;$('panel').classList.add('hide');toast('GO!')}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,900)}
function spawn(){
const x=[-.66,0,.66][Math.random()*3|0],z=pos+DRAW*SEG*.95;
if(Math.random()<.3){for(let k=0;k<5;k++)items.push({coin:1,x,z:z+k*SEG*1.3,sp:0})}
else{items.push({x,z,sp:maxS()*(.18+Math.random()*.3),c:`hsl(${Math.random()*360|0} 70% 55%)`});
if(stage>2&&Math.random()<.4){const x2=[-.66,0,.66].filter(v=>v!==x)[Math.random()*2|0];items.push({x:x2,z:z+SEG*3,sp:maxS()*(.18+Math.random()*.3),c:`hsl(${Math.random()*360|0} 70% 55%)`})}}}
function update(dt){
const mx=maxS(),sp=Math.min(1,speed/mx);
const steer=tgt!==null?Math.max(-1,Math.min(1,(tgt-px)*4)):Math.max(-1,Math.min(1,keyR-keyL));
steerS+=(steer-steerS)*Math.min(1,dt*10);
let tg=(nOn&&nitro>0)?mx*1.4:mx;if(Math.abs(px)>1.05)tg*=.4;
speed+=(tg-speed)*dt*(nOn?1.6:.7);
const base=pos/SEG|0;
if(tgt!==null)px+=(tgt-px)*Math.min(1,dt*(7+S.han*1.5));else px+=steerS*dt*(1.7+S.han*.3)*(.3+.7*Math.min(1,speed/6000));
px-=curve[base%L]*dt*.2*sp;
if(Math.abs(px)>1.22){if(inv>0)px=Math.sign(px)*1.2;else{hearts=0;return end()}}
px=Math.max(-1.7,Math.min(1.7,px));
if(nOn&&nitro>0){nitro-=dt*(.3-S.nit*.03)*(1);if(nitro<=0){nitro=0;nOn=false}}else nitro=Math.min(1,nitro+dt*.02);
pos+=speed*dt;dist+=speed*dt/100;bg+=curve[base%L]*sp*dt*40;
const ns=1+(dist/1500|0);if(ns!==stage){stage=ns;toast('STAGE '+stage)}
spT-=dt;if(spT<=0){spT=Math.max(.3,.95-stage*.08)*(.6+Math.random()*.8);spawn()}
if(inv>0)inv-=dt;if(shake>0)shake-=dt;
for(const it of items){
it.z+=it.sp*dt;const dz=it.z-pos;
if(!it.done&&dz<PZ&&dz>PZ-300&&!it.chk){it.chk=1;const d=Math.abs(it.x-px);
if(it.coin){if(d<.3){it.done=1;rc++;nitro=Math.min(1,nitro+.03)}}
else if(d<.26){if(inv<=0){hearts--;speed*=.35;inv=1.6;shake=.4;it.done=1;if(hearts<=0)return end()}}
else if(d<.45){nitro=Math.min(1,nitro+.12);toast('NEAR MISS!')}}}
items=items.filter(it=>it.z-pos>300)}
function end(){
run=false;nOn=false;shake=0;lastEarn=rc+(dist/50|0);S.coins+=lastEarn;S.best=Math.max(S.best,dist|0);save();setTimeout(()=>over(),500)}
function hud(){
$('hh').textContent='❤️'.repeat(Math.max(0,hearts));$('cc').textContent='🪙 '+rc+' this run';
$('dd').textContent=dist|0;$('ss').textContent=stage;$('sp').textContent=(speed*.02)|0;$('nfill').style.width=(nitro*100)+'%'}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function car(cx,by,w,col){
const h=w*.6;
g.fillStyle='#0008';g.beginPath();g.ellipse(cx,by,w*.6,h*.1,0,0,7);g.fill();
g.fillStyle='#0c0c11';rr(cx-w*.53,by-h*.36,w*.16,h*.38,w*.04);rr(cx+w*.37,by-h*.36,w*.16,h*.38,w*.04);
g.fillStyle=col;rr(cx-w*.5,by-h*.66,w,h*.5,w*.1);
g.beginPath();g.moveTo(cx-w*.37,by-h*.6);g.lineTo(cx-w*.27,by-h);g.lineTo(cx+w*.27,by-h);g.lineTo(cx+w*.37,by-h*.6);g.fill();
const s=g.createLinearGradient(0,by-h,0,by-h*.15);s.addColorStop(0,'rgba(255,255,255,.38)');s.addColorStop(.5,'rgba(255,255,255,0)');s.addColorStop(1,'rgba(0,0,0,.42)');
g.fillStyle=s;rr(cx-w*.5,by-h*.66,w,h*.5,w*.1);
g.fillStyle='#101a33';g.beginPath();g.moveTo(cx-w*.3,by-h*.62);g.lineTo(cx-w*.22,by-h*.92);g.lineTo(cx+w*.22,by-h*.92);g.lineTo(cx+w*.3,by-h*.62);g.fill();
g.fillStyle='rgba(140,190,255,.25)';g.beginPath();g.moveTo(cx-w*.2,by-h*.9);g.lineTo(cx-w*.05,by-h*.9);g.lineTo(cx-w*.17,by-h*.64);g.lineTo(cx-w*.27,by-h*.64);g.fill();
g.fillStyle='#14151c';rr(cx-w*.46,by-h*.76,w*.92,h*.07,w*.02);rr(cx-w*.3,by-h*.7,w*.05,h*.07,0);rr(cx+w*.25,by-h*.7,w*.05,h*.07,0);
g.fillStyle='#ff1f3d';rr(cx-w*.47,by-h*.52,w*.34,h*.1,w*.03);rr(cx+w*.13,by-h*.52,w*.34,h*.1,w*.03);
g.fillStyle='#ffa0ae';rr(cx-w*.45,by-h*.5,w*.3,h*.03,w*.01);rr(cx+w*.15,by-h*.5,w*.3,h*.03,w*.01);
g.fillStyle='#16171f';rr(cx-w*.47,by-h*.36,w*.94,h*.2,w*.05);
g.fillStyle='#f2f2f2';rr(cx-w*.1,by-h*.5,w*.2,h*.1,w*.015);
g.fillStyle='#b8bccc';g.beginPath();g.arc(cx-w*.3,by-h*.22,w*.04,0,7);g.fill();g.beginPath();g.arc(cx+w*.3,by-h*.22,w*.04,0,7);g.fill()}
function pv(){pvTok++;const c=$('pv');if(!c)return;const m=g;g=c.getContext('2d');const a=c.width,b=c.height;
const f=g.createLinearGradient(0,0,0,b);f.addColorStop(0,'#2d3270');f.addColorStop(1,'#10132b');g.fillStyle=f;g.fillRect(0,0,a,b);
g.fillStyle='#ffffff14';g.beginPath();g.ellipse(a/2,b*.9,a*.42,b*.1,0,0,7);g.fill();
car(a/2,b*.9,a*.5,COLS[S.col]);g=m}
function carOld(cx,by,w,col){
const h=w*.62;
g.fillStyle='#0006';g.beginPath();g.ellipse(cx,by,w*.58,h*.1,0,0,7);g.fill();
g.fillStyle='#111';g.fillRect(cx-w*.5,by-h*.28,w*.14,h*.3);g.fillRect(cx+w*.36,by-h*.28,w*.14,h*.3);
g.fillStyle=col;g.beginPath();g.roundRect(cx-w/2,by-h*.62,w,h*.5,w*.08);g.fill();
g.beginPath();g.roundRect(cx-w*.37,by-h,w*.74,h*.5,w*.12);g.fill();
g.fillStyle='#16203a';g.beginPath();g.roundRect(cx-w*.31,by-h*.93,w*.62,h*.3,w*.06);g.fill();
g.fillStyle='#ff2a2a';g.fillRect(cx-w*.45,by-h*.5,w*.22,h*.12);g.fillRect(cx+w*.23,by-h*.5,w*.22,h*.12)}
function q(x1,y1,w1,x2,y2,w2,c){g.fillStyle=c;g.beginPath();g.moveTo(x1-w1,y1);g.lineTo(x1+w1,y1);g.lineTo(x2+w2,y2);g.lineTo(x2-w2,y2);g.fill()}
const HC=['#e8c9a0','#cfe3f0','#f0d27a','#d9a3b5','#b9d9b0','#e9e1d8'];
function hs(i){return((i*2654435761)>>>0)%1000/1000}
function scenery(n,idx,y1,y2,cx,ww){
const hh=hs(idx);
for(const sd of[-1,1]){
const s=ww[n],f1=cx[n]+sd*s*1.22,f2=cx[n+1]+sd*ww[n+1]*1.22;
g.strokeStyle='#efe2bd';g.lineWidth=Math.max(1,s*.014);g.beginPath();
g.moveTo(f1,y1-s*.05);g.lineTo(f2,y2-ww[n+1]*.05);g.moveTo(f1,y1-s*.11);g.lineTo(f2,y2-ww[n+1]*.11);g.stroke();
if(idx%2===0){g.fillStyle='#b08850';g.fillRect(f1-s*.014,y1-s*.15,s*.028,s*.15)}
if(idx%6===(sd>0?0:3)){const tx=cx[n]+sd*s*(1.7+hh*.5);
g.fillStyle='#5a3a22';g.fillRect(tx-s*.03,y1-s*.22,s*.06,s*.22);
g.fillStyle=hh>.5?'#1f7a3a':'#2c9a4a';g.beginPath();g.arc(tx,y1-s*.34,s*.17,0,7);g.fill()}
if(idx%14===(sd>0?2:9)){const hx=cx[n]+sd*s*(2.6+hh*.6),bw=s*.55,bh=s*.4;
g.fillStyle=HC[(hh*6)|0];g.fillRect(hx-bw/2,y1-bh,bw,bh);
g.fillStyle='#b23a3a';g.beginPath();g.moveTo(hx-bw*.62,y1-bh);g.lineTo(hx,y1-bh-s*.28);g.lineTo(hx+bw*.62,y1-bh);g.fill();
g.fillStyle='#4a2f1a';g.fillRect(hx-bw*.08,y1-bh*.5,bw*.16,bh*.5);
g.fillStyle='#ffe9a8';g.fillRect(hx-bw*.38,y1-bh*.75,bw*.2,bh*.22);g.fillRect(hx+bw*.18,y1-bh*.75,bw*.2,bh*.22)}}}
function draw(t){
g.setTransform(1,0,0,1,0,0);
const hz=H/2,gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#1c1b4d');gr.addColorStop(1,'#ff9b5e');g.fillStyle=gr;g.fillRect(0,0,W,hz+2);
g.fillStyle='#ffe29a';g.beginPath();g.arc(W*.7,hz-H*.07,H*.05,0,7);g.fill();
